
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Royal Table — Admin</title>
<style>
:root{--gold:#d6b46a;--bg:#111;--panel:#1d1d1d;--cream:#f5efdf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:16px Arial,sans-serif}
header{text-align:center;padding:24px;border-bottom:1px solid #55472a}
h1{color:var(--gold)}
main{max-width:800px;margin:auto;padding:16px}
.panel{background:var(--panel);border:1px solid #45402f;border-radius:12px;padding:18px;margin-bottom:18px}
label{display:block;margin:12px 0 6px}
input:not([type=checkbox]),button{width:100%;padding:12px;border-radius:8px;font-size:16px}
input:not([type=checkbox]){background:#111;color:white;border:1px solid #55472a}
button{margin-top:12px;border:0;background:var(--gold);font-weight:bold;cursor:pointer}
.secondary{background:#444!important;color:white}
.danger{background:#8b3030!important;color:white}
.status{white-space:pre-wrap;overflow-wrap:anywhere}
.muted{color:#bbb;font-size:14px}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.item{border:1px solid #45402f;padding:10px;border-radius:8px;min-width:0}
.item img,.item video{width:100%;max-height:260px;object-fit:contain;background:#000}
</style>
</head>
<body>
<header>
<h1>The Royal Table</h1>
<p class="muted">Owner Admin Dashboard</p>
</header>
<main>
<section class="panel">
<h2>Connect Supabase</h2>
<label for="url">Project URL / API URL</label>
<input id="url" type="url" placeholder="https://your-project.supabase.co">
<label for="key">Publishable key / legacy anon key</label>
<input id="key" type="password" placeholder="Paste public key">
<button id="connect">Connect</button>
<p id="connectionStatus" class="status"></p>
</section>

<section id="loginPanel" class="panel hidden">
<h2>Owner sign-in</h2>
<form id="loginForm">
<label for="email">Email</label>
<input id="email" type="email" required autocomplete="username">
<label for="password">Password</label>
<input id="password" type="password" required autocomplete="current-password">
<button id="loginButton">Sign in</button>
</form>
<button id="logout" class="secondary hidden" type="button">Sign out</button>
<p id="authStatus" class="status"></p>
</section>

<section id="uploadPanel" class="panel hidden">
<h2>Upload photo or video</h2>
<p class="muted">Images up to 10 MB; videos up to 50 MB. Published media is publicly viewable.</p>
<form id="uploadForm">
<label for="file">Choose media</label>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" required>
<label for="caption">Caption</label>
<input id="caption" maxlength="160" placeholder="Wedding table setting">
<label><input id="published" type="checkbox" checked> Publish to gallery</label>
<button id="uploadButton">Upload</button>
</form>
<p id="uploadStatus" class="status"></p>
</section>

<section id="galleryPanel" class="panel hidden">
<h2>Manage gallery</h2>
<button id="refresh" class="secondary" type="button">Refresh</button>
<p id="galleryStatus" class="status"></p>
<div id="gallery" class="grid"></div>
</section>
</main>

<script type="module">
import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const $ = id => document.getElementById(id);
const BUCKET = "royal-gallery";
let db = null;
let user = null;

function message(id, text) { $(id).textContent = text; }
function visible(id, yes) { $(id).classList.toggle("hidden", !yes); }

function baseUrl(value) {
  let parsed;
  try { parsed = new URL(value.trim()); }
  catch { throw new Error("Copy the full HTTPS API URL from Supabase Data API."); }

  if (parsed.protocol !== "https:" || !parsed.hostname ||
      parsed.username || parsed.password) {
    throw new Error("The URL must be a valid HTTPS Supabase API URL.");
  }
  return parsed.origin;
}

async function isOwner() {
  const { data: { user: current }, error: authError } =
    await db.auth.getUser();
  if (authError) throw authError;
  if (!current) return false;

  const { data, error } = await db
    .from("gallery_admins")
    .select("user_id")
    .eq("user_id", current.id)
    .maybeSingle();

  if (error) throw error;
  user = current;
  return Boolean(data);
}

async function refreshSession() {
  user = null;
  visible("uploadPanel", false);
  visible("galleryPanel", false);

  const { data: { session }, error } = await db.auth.getSession();
  if (error) throw error;

  if (!session) {
    visible("logout", false);
    message("authStatus", "Sign in with your owner account.");
    return;
  }

  visible("logout", true);

  let allowed;
  try { allowed = await isOwner(); }
  catch (e) {
    message("authStatus", "Owner verification failed: " + e.message);
    return;
  }

  if (!allowed) {
    message("authStatus", "This account is not registered in gallery_admins.");
    return;
  }

  visible("uploadPanel", true);
  visible("galleryPanel", true);
  message("authStatus", "Owner verified.");
  await loadGallery();
}

$("connect").addEventListener("click", async () => {
  const button = $("connect");
  button.disabled = true;

  try {
    const url = baseUrl($("url").value);
    const key = $("key").value.trim();

    if (!key) throw new Error("Paste your public Publishable/anon key.");
    if (/\s/.test(key)) throw new Error("The key contains spaces. Copy it again.");
    if (!key.startsWith("sb_publishable_") && !key.startsWith("eyJ")) {
      throw new Error("Use a Supabase Publishable key or legacy anon key, not a secret key.");
    }

    db = createClient(url, key);
    visible("loginPanel", true);
    message("connectionStatus", "Client configured. Sign in to verify access.");
    await refreshSession();
  } catch (e) {
    message("connectionStatus", "Connection setup: " + e.message);
  } finally {
    button.disabled = false;
  }
});

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!db) {
    message("authStatus", "Connect Supabase first.");
    return;
  }

  $("loginButton").disabled = true;
  message("authStatus", "Signing in...");

  try {
    const { error } = await db.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });
    if (error) throw error;
    $("password").value = "";
    await refreshSession();
  } catch (e) {
    message("authStatus", "Sign-in failed: " + e.message);
  } finally {
    $("loginButton").disabled = false;
  }
});

$("logout").addEventListener("click", async () => {
  const { error } = await db.auth.signOut();
  if (error) message("authStatus", error.message);
  else {
    user = null;
    visible("uploadPanel", false);
    visible("galleryPanel", false);
    visible("logout", false);
    message("authStatus", "Signed out.");
  }
});

function safeName(name) {
  return name.normalize("NFKD").replace(/[^a-zA-Z0-9._-]/g, "-").slice(-100)
    || "upload";
}

$("uploadForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!db || !user || !(await isOwner())) {
    message("uploadStatus", "Owner access is required.");
    return;
  }

  const file = $("file").files[0];
  if (!file) return;

  const imageTypes = ["image/jpeg","image/png","image/webp","image/gif"];
  const videoTypes = ["video/mp4","video/webm"];
  const image = imageTypes.includes(file.type);
  const video = videoTypes.includes(file.type);

  if (!image && !video) {
    message("uploadStatus", "Choose JPG, PNG, WebP, GIF, MP4 or WebM.");
    return;
  }
  if (file.size > (video ? 50 : 10) * 1024 * 1024) {
    message("uploadStatus", video ? "Video limit is 50 MB." : "Image limit is 10 MB.");
    return;
  }

  $("uploadButton").disabled = true;
  const path = `${user.id}/${crypto.randomUUID()}-${safeName(file.name)}`;
  let uploaded = false;

  try {
    const { error: uploadError } = await db.storage.from(BUCKET)
      .upload(path, file, { contentType: file.type, upsert: false });
    if (uploadError) throw uploadError;
    uploaded = true;

    const { data: publicData } = db.storage.from(BUCKET).getPublicUrl(path);

    const { error: rowError } = await db.from("gallery_media").insert({
      owner_id: user.id,
      storage_path: path,
      public_url: publicData.publicUrl,
      media_type: video ? "video" : "image",
      caption: $("caption").value.trim() || null,
      published: $("published").checked
    });
    if (rowError) throw rowError;

    $("uploadForm").reset();
    message("uploadStatus", "Upload successful.");
    await loadGallery();
  } catch (e) {
    if (uploaded) await db.storage.from(BUCKET).remove([path]);
    message("uploadStatus", "Upload failed: " + e.message);
  } finally {
    $("uploadButton").disabled = false;
  }
});

async function loadGallery() {
  if (!db || !user) return;

  message("galleryStatus", "Loading...");
  $("gallery").replaceChildren();

  const { data, error } = await db.from("gallery_media")
    .select("id,storage_path,public_url,media_type,caption,published,created_at")
    .eq("owner_id", user.id)
    .order("created_at", { ascending: false });

  if (error) {
    message("galleryStatus", "Gallery error: " + error.message);
    return;
  }

  message("galleryStatus", data.length ? `${data.length} item(s)` : "No media uploaded yet.");

  for (const item of data) {
    const card = document.createElement("article");
    card.className = "item";

    const media = document.createElement(item.media_type === "video" ? "video" : "img");
    media.src = item.public_url;
    if (item.media_type === "video") media.controls = true;
    else { media.alt = item.caption || "Gallery photo"; media.loading = "lazy"; }
    card.append(media);

    const caption = document.createElement("p");
    caption.textContent = item.caption || "Untitled";
    card.append(caption);

    const state = document.createElement("p");
    state.className = "muted";
    state.textContent = item.published ? "Published" : "Unpublished";
    card.append(state);

    const toggle = document.createElement("button");
    toggle.className = "secondary";
    toggle.textContent = item.published ? "Unpublish" : "Publish";
    toggle.addEventListener("click", async () => {
      toggle.disabled = true;
      const { error } = await db.from("gallery_media")
        .update({ published: !item.published })
        .eq("id", item.id).eq("owner_id", user.id);
      if (error) message("galleryStatus", "Update failed: " + error.message);
      else await loadGallery();
      toggle.disabled = false;
    });
    card.append(toggle);

    const remove = document.createElement("button");
    remove.className = "danger";
    remove.textContent = "Delete";
    remove.addEventListener("click", async () => {
      if (!confirm("Permanently delete this media?")) return;
      remove.disabled = true;

      const { error: storageError } = await db.storage.from(BUCKET)
        .remove([item.storage_path]);
      if (storageError) {
        message("galleryStatus", "Storage delete failed: " + storageError.message);
        remove.disabled = false;
        return;
      }

      const { error: rowError } = await db.from("gallery_media")
        .delete().eq("id", item.id).eq("owner_id", user.id);
      if (rowError) {
        message("galleryStatus", "Database cleanup failed: " + rowError.message);
        remove.disabled = false;
        return;
      }
      await loadGallery();
    });
    card.append(remove);
    $("gallery").append(card);
  }
}

$("refresh").addEventListener("click", loadGallery);
</script>
</body>
</html>
